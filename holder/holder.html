<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <title id="page-title">Dumbux - Loading...</title>
    <link rel="icon" href="../assets//logo.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .back-arrow {
            transition: transform 0.3s ease;
        }
        
        .back-arrow:hover {
            transform: translateX(-5px);
        }
        
        .container-box {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .container-box:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        
        .diagonal-text {
            transform: rotate(-25deg);
            transform-origin: center;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <div class="flex items-center gap-8 mb-8">
            <!-- Back Arrow -->
            <button class="back-arrow cursor-pointer" onclick="goHome()">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 36L18 24L30 12" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            
            <!-- Title -->
            <h1 id="game-title-display" class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                Loading
            </h1>
        </div>
        
        <!-- Main Container -->
            <div id="game-content" class="container-box bg-white rounded-3xl border-2 border-slate-300 h-[80vh] overflow-hidden relative">
            <iframe
                id="sandbox-frame"
                src=""
                loading="lazy"
                sandbox="allow-scripts allow-pointer-lock allow-same-origin"
                class="w-full h-full border-0"
            ></iframe>
            </div>
    </div>
    <script src="holderScript.js"></script>
</body>
</html>
