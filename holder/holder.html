<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <title id="page-title">Dumbux - Loading...</title>
    <link rel="icon" href="../assets//logo.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .back-arrow {
            transition: transform 0.3s ease;
        }
        
        .back-arrow:hover {
            transform: translateX(-5px);
        }
        
        .container-box {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .container-box:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        
        .diagonal-text {
            transform: rotate(-25deg);
            transform-origin: center;
        }

                /* Navbar için hafif cam efekti */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen p-4">

        <!-- Header -->
        <header class="fixed top-0 left-0 right-0 z-[100] glass-nav shadow-sm">
            <div class="max-w-7xl mx-auto px-4 h-16 md:h-24 flex items-center justify-between">
                
                <a href="../index.html" class="flex items-center gap-3 md:gap-5 hover:opacity-80 transition-opacity cursor-pointer">
                    <img src="../assets/logo.ico" alt="Logo" class="w-8 h-8 md:w-12 md:h-12 object-contain border rounded">
                    <div class="flex flex-col md:flex-row md:items-baseline md:gap-3">
                        <span class="text-xl md:text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                            Dumbux

                        <span class="text-slate-400 hidden sm:block">|</span>
                        <span class="text-slate-500 text-sm md:text-lg font-medium">
                            Messy SandBox
                        </span>
                    </div>
                </a>

                <div class="relative">
                    <button id="sendItBtn" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 py-2 md:px-7 md:py-3 rounded-full font-bold shadow-lg hover:scale-105 transition-all duration-300 active:scale-95 text-xs md:text-base border border-white/20 flex items-center gap-2">
                        <span>🚀 Send It</span> 
                    </button>

                    <div id="emailPanel" class="hidden absolute right-0 mt-4 bg-white/95 backdrop-blur-md border border-indigo-100 p-5 rounded-2xl shadow-2xl min-w-[280px] animate-in fade-in slide-in-from-top-2 duration-300">
                        <div class="flex justify-between items-start mb-2">
                            <p class="text-slate-600 text-sm font-semibold">Share your chaos!</p>
                            <button id="closePanel" class="text-slate-400 hover:text-slate-600 text-xs p-1">Close</button>
                        </div>
                        <p class="text-slate-500 text-xs leading-relaxed mb-3">
                            If you have some weird, stupid sandbox in 1 html file, send it here:
                        </p>
                        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=simuxcentre0@gmail.com" 
                        target="_blank" 
                        class="block text-indigo-600 font-bold hover:text-purple-600 transition-colors duration-200 break-all underline decoration-indigo-200 underline-offset-4 text-sm">
                            simuxcentre0@gmail.com
                        </a>
                    </div>
                </div>

            </div>
        </header>
    
    <div class="max-w-7xl mx-auto pt-20 md:pt-28">
        <!-- Header Section -->
        <div class="flex items-center gap-8 mb-8">
            <!-- Back Arrow -->
            <button class="back-arrow cursor-pointer" onclick="javascript : history.back()">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 36L18 24L30 12" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            
            <!-- Title -->
            <h1 id="game-title-display" class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                Loading
            </h1>
        </div>
        
        <!-- Main Container -->
            <div id="game-content" class="container-box bg-white rounded-3xl border-2 border-slate-300 h-[80vh] overflow-hidden relative">
            <iframe
                id="sandbox-frame"
                src=""
                loading="lazy"
                sandbox="allow-scripts allow-pointer-lock allow-same-origin"
                class="w-full h-full border-0"
            ></iframe>
            </div>

        <!-- Other Games -->
        <div class="mt-6 md:mt-10 lg:mt-12 bg-white rounded-3xl shadow-2xl p-3 md:p-12">
            <div 
                id="gamesGridForHolder" 
                class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-8 ">
            </div>
        </div>
        
        <!-- Footer -->

                    Privacy Policy
                </a>
                <a href="mailto:simuxcentre0@gmail.com" class="text-slate-500 hover:text-indigo-600 transition-colors duration-200 decoration-indigo-200 underline-offset-4 hover:underline">
                    Contact Us
                </a>
                <a href="../legal/tos.html" class="text-slate-500 hover:text-indigo-600 transition-colors duration-200 decoration-indigo-200 underline-offset-4 hover:underline">
                    Terms of Service
                </a>
            </div>

            <div class="max-w-[200px] h-[1px] bg-gradient-to-r from-transparent via-slate-200 to-transparent mx-auto mb-6"></div>

            <p class="text-xs md:text-sm text-slate-400">
                © 2025 <span class="font-bold text-slate-500">Dumbux</span>. All rights reserved. | Stay Messy.
            </p>
        </footer>
    </div>

    <script type="module" src="holderScript.js"></script>
</body>
</html>
