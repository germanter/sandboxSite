<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <title id="page-title">Dumbux - Loading...</title>
    <link rel="icon" href="../assets//logo.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .back-arrow {
            transition: transform 0.3s ease;
        }
        
        .back-arrow:hover {
            transform: translateX(-5px);
        }
        
        .container-box {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .container-box:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        
        .diagonal-text {
            transform: rotate(-25deg);
            transform-origin: center;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <div class="flex items-center gap-8 mb-8">
            <!-- Back Arrow -->
            <button class="back-arrow cursor-pointer" onclick="javascript : history.back()">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 36L18 24L30 12" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            
            <!-- Title -->
            <h1 id="game-title-display" class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                Loading
            </h1>
        </div>
        
        <!-- Main Container -->
            <div id="game-content" class="container-box bg-white rounded-3xl border-2 border-slate-300 h-[80vh] overflow-hidden relative">
            <iframe
                id="sandbox-frame"
                src=""
                loading="lazy"
                sandbox="allow-scripts allow-pointer-lock allow-same-origin"
                class="w-full h-full border-0"
            ></iframe>
            </div>

        <!-- Other Games -->
        <div class="mt-6 md:mt-10 lg:mt-12 bg-white rounded-3xl shadow-2xl p-3 md:p-12">
            <div 
                id="gamesGridForHolder" 
                class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-8 ">
            </div>
        </div>
        
        <!-- Footer -->
        <footer class="relative text-center mt-12 mb-8 text-slate-600 w-full">
            <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-6 text-sm font-semibold tracking-wide">
                <a href="../legal/privacy.html" class="text-slate-500 hover:text-indigo-600 transition-colors duration-200 decoration-indigo-200 underline-offset-4 hover:underline">
                    Privacy Policy
                </a>
                <a href="mailto:simuxcentre0@gmail.com" class="text-slate-500 hover:text-indigo-600 transition-colors duration-200 decoration-indigo-200 underline-offset-4 hover:underline">
                    Contact Us
                </a>
                <a href="../legal/tos.html" class="text-slate-500 hover:text-indigo-600 transition-colors duration-200 decoration-indigo-200 underline-offset-4 hover:underline">
                    Terms of Service
                </a>
            </div>

            <div class="max-w-[200px] h-[1px] bg-gradient-to-r from-transparent via-slate-200 to-transparent mx-auto mb-6"></div>

            <p class="text-xs md:text-sm text-slate-400">
                © 2025 <span class="font-bold text-slate-500">Dumbux</span>. All rights reserved. | Stay Messy.
            </p>
        </footer>
    </div>

    <script type="module" src="holderScript.js"></script>
</body>
</html>
