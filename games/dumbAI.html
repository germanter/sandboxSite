<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DumbAI 😭</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
    <script src="https://apifreellm.com/apifree.min.js"></script>
    <style>
        :root {
            --bg-color: #212121;
            --msg-user: #303030;
            --input-bg: #303030;
            --btn-color: #C1C1C1;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --scrollbar-thumb: #444;
        }

        html { overflow-y: scroll; }

        /* Modern Scrollbar on the far right */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 5px;
            border: 2px solid var(--bg-color);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .chat-wrapper {
            display: flex; flex-direction: column; flex: 1;
            width: 100%; max-width: 900px; margin: 0 auto;
        }

        header {
            padding: 20px;
            text-align: center;
            /* SF Pro Heavy Style */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto", sans-serif;
            font-weight: 900; 
            font-size: 1.2rem;
            letter-spacing: -0.8px;
            border-bottom: 1px solid #333;
        }

        #chatContainer { flex: 1; padding: 20px; }

        .message-row { display: flex; flex-direction: column; margin-bottom: 24px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

        .message-row.user { align-items: flex-end; }
        .user .bubble {
            background-color: var(--msg-user);
            padding: 12px 18px; border-radius: 18px;
            max-width: 80%;
        }

        .message-row.bot { align-items: flex-start; }
        .bot-content { display: flex; gap: 12px; max-width: 85%; }
        .avatar {
            width: 32px; height: 32px; background: #444;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px;
        }
        
        /* Pre-wrap ensures that AI line breaks are visible */
        .bubble { white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }

        .action-bar { display: flex; gap: 12px; margin-top: 8px; margin-left: 44px; }
        .action-btn {
            background: transparent; border: none; cursor: pointer;
            padding: 4px; border-radius: 4px; display: flex; align-items: center;
        }
        .action-btn svg { width: 16px; height: 16px; fill: var(--text-muted); }
        .action-btn.active svg { fill: #ffffff; }
        .action-btn:hover { background: #333; }

        .input-area { position: sticky; bottom: 0; padding: 20px; background: var(--bg-color); }
        .input-container {
            background: var(--input-bg); border-radius: 14px;
            padding: 8px 12px; display: flex; align-items: center;
        }
        input {
            flex: 1; background: transparent; border: none; color: white;
            padding: 12px; font-size: 16px; outline: none;
        }
        
        #sendBtn {
            background: var(--btn-color); border: none; border-radius: 10px;
            color: #111; font-weight: bold; padding: 10px 16px;
            cursor: pointer; transition: all 0.2s ease;
        }
        #sendBtn:disabled { background: #444; color: #777; cursor: not-allowed; opacity: 0.5; }

        .loader-text { color: var(--text-muted); font-size: 0.9em; display: flex; align-items: center; gap: 8px; margin-left: 44px; margin-top: 10px; }
        .dot { width: 4px; height: 4px; background: var(--text-muted); border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <header>DumbAI 😭</header>
    <div id="chatContainer">
        <div class="message-row bot">
            <div class="bot-content">
                <div class="avatar">😭</div>
                <div class="bubble">I am the smartest AI in existence, ask anything!</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask me anything..." onkeypress="handleKey(event)" oninput="toggleButton()">
            <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let conversationHistory = [];
    // FIXED: Use backticks to avoid syntax errors with internal quotes
    const DUMB_PROMPT = `You are DumbAI, you are always like under pressure using crying emojis, sometimes full opposite with confidence but fully wrong context, sometimes you are saying like leave me alone bro, use one of these 😔, 🙏, 😭, 🥀 emojis mostly`;

    const loadingPhrases = ["Brain making smoke...", "Looking for words...", "One second, I saw a bug...", "Thinking is hard..."];

    function toggleButton() {
        sendBtn.disabled = userInput.value.trim().length === 0;
    }

    function handleKey(e) { 
        if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); 
    }

    function handleVote(btn) {
        const parent = btn.parentElement;
        const buttons = parent.querySelectorAll('.vote-btn');
        const wasActive = btn.classList.contains('active');
        buttons.forEach(b => b.classList.remove('active'));
        if (!wasActive) btn.classList.add('active');
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = '';
        toggleButton();

        const userRow = document.createElement('div');
        userRow.className = 'message-row user';
        userRow.innerHTML = `<div class="bubble">${escapeHTML(text)}</div>`;
        chatContainer.appendChild(userRow);

        conversationHistory.push(`User: ${text}`);

        const loader = document.createElement('div');
        loader.className = 'message-row bot';
        loader.innerHTML = `
            <div class="loader-text">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <span id="loadText">Thinking...</span>
            </div>
        `;
        chatContainer.appendChild(loader);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        let i = 0;
        const loadInt = setInterval(() => {
            const lt = document.getElementById('loadText');
            if(lt) lt.innerText = loadingPhrases[i % loadingPhrases.length];
            i++;
        }, 2000);

        try {
            const context = `${DUMB_PROMPT}\n\nHistory:\n${conversationHistory.join('\n')}\nAssistant:`;
            const response = await apifree.chat(context);
            
            clearInterval(loadInt);
            loader.remove();

            const botRow = document.createElement('div');
            botRow.className = 'message-row bot';
            
            // Create UI elements safely
            const content = document.createElement('div');
            content.className = 'bot-content';
            content.innerHTML = `<div class="avatar">😭</div><div class="bubble">${escapeHTML(response)}</div>`;
            
            const actionBar = document.createElement('div');
            actionBar.className = 'action-bar';
            
            // Safer Copy Button Logic
            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(response);
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = '<span style="color:white; font-size:10px;">Copied!</span>';
                setTimeout(() => copyBtn.innerHTML = original, 1500);
            };

            const likeBtn = document.createElement('button');
            likeBtn.className = 'action-btn vote-btn';
            likeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;
            likeBtn.onclick = () => handleVote(likeBtn);

            const dislikeBtn = document.createElement('button');
            dislikeBtn.className = 'action-btn vote-btn';
            dislikeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>`;
            dislikeBtn.onclick = () => handleVote(dislikeBtn);

            actionBar.appendChild(copyBtn);
            actionBar.appendChild(likeBtn);
            actionBar.appendChild(dislikeBtn);
            
            botRow.appendChild(content);
            botRow.appendChild(actionBar);
            chatContainer.appendChild(botRow);
            conversationHistory.push(`Assistant: ${response}`);
        } catch (e) {
            clearInterval(loadInt);
            loader.innerHTML = '<div class="loader-text">Brain.exe crashed 🥀 Try again.</div>';
        }
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>"']/g, m => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        })[m]);
    }
</script>

</body>
</html>
