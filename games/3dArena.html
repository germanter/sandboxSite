<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>3D Sandbox - Camera Modes</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            -webkit-touch-callout: none;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* --- UI PANEL --- */
        #ui-panel {
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            padding: 15px;
            position: absolute;
            box-sizing: border-box;
            z-index: 10;
        }

        h2, .section-title { text-align: center; margin: 0; }
        h2 { color: #4db8ff; font-size: 18px; margin-bottom: 10px; }
        .section-title { font-size: 11px; text-transform: uppercase; color: #aaa; margin: 12px 0 6px 0; border-bottom: 1px solid #444; padding-bottom: 2px; }

        button {
            background: #333;
            border: 1px solid #555;
            color: #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }

        /* Button Colors */
        .btn-add { border-left: 3px solid #4db8ff; }
        .btn-obj-tool { border-left: 3px solid #ffb84d; }
        .btn-cam-tool { border-left: 3px solid #55ff88; } /* Green for Camera */
        .btn-clear { border-left: 3px solid #ff4d4d; }
        
        /* Active States */
        .active-mode { background: #ffb84d; color: #222; border-color: #ffb84d; }
        .active-cam { background: #55ff88; color: #222; border-color: #55ff88; }

        /* --- DESKTOP --- */
        @media (min-width: 769px) {
            #ui-panel {
                top: 20px; left: 20px; width: 230px;
                border-radius: 12px;
                max-height: 90vh; overflow-y: auto;
            }
            button { width: 100%; padding: 10px; margin-bottom: 6px; }
            button:hover { background: #444; transform: translateX(2px); }
            
            #instructions {
                position: absolute; bottom: 20px; left: 20px;
                color: #888; font-size: 13px; pointer-events: none;
                background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
            }
        }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            #ui-panel {
                bottom: 0; left: 0; width: 100%; height: auto;
                border-radius: 20px 20px 0 0;
                display: flex; flex-direction: row; align-items: center;
                gap: 12px;
                overflow-x: auto;
                padding: 15px 15px 30px 15px;
                -ms-overflow-style: none; scrollbar-width: none;
            }
            #ui-panel::-webkit-scrollbar { display: none; }
            
            h2, .section-title { display: none; } /* Compact mode */
            
            .ui-group { display: flex; gap: 8px; flex-shrink: 0; }
            .separator { width: 1px; height: 40px; background: #555; margin: 0 5px; }

            button {
                padding: 0 16px; height: 44px; margin: 0;
                min-width: 70px; display: flex; align-items: center; justify-content: center;
            }
            #instructions { display: none; }
        }

        #info {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.6); color: #fff;
            padding: 8px 15px; border-radius: 20px;
            font-size: 12px; pointer-events: none;
            opacity: 0; transition: opacity 0.3s;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-panel">
        <h2>Sandbox</h2>
        
        <div class="section-title">Spawn</div>
        <div class="ui-group">
            <button id="add-cube" class="btn-add">Cube</button>
            <button id="add-sphere" class="btn-add">Sphere</button>
            <button id="add-cone" class="btn-add">Cone</button>
            <button id="add-torus" class="btn-add">Donut</button>
        </div>

        <div class="separator"></div>

        <div class="section-title">Obj Tools</div>
        <div class="ui-group">
            <button id="mode-translate" class="btn-obj-tool active-mode">Move Obj</button>
            <button id="mode-rotate" class="btn-obj-tool">Rotate Obj</button>
            <button id="action-delete" class="btn-clear">Delete</button>
        </div>

        <div class="separator"></div>

        <div class="section-title">Camera Mode</div>
        <div class="ui-group">
            <button id="cam-look" class="btn-cam-tool active-cam">👁️ Look</button>
            <button id="cam-float" class="btn-cam-tool">✋ Float</button>
        </div>
    </div>

    <div id="instructions">
        <b>Camera:</b> Left Drag to Look | Right Drag to Float<br>
        <b>Objects:</b> Click to Select | T: Move | R: Rotate
    </div>

    <div id="info">Object Selected</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- Scene & Camera ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 12, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- Lights & Floor ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(100, 100, 0x444444, 0x333333);
        scene.add(gridHelper);

        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.01;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- CONTROLS SETUP ---
        
        // 1. Camera Controls (Orbit)
        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        orbit.screenSpacePanning = true; // Essential for "Floating" feel
        
        // 2. Object Controls (Gizmo)
        const control = new TransformControls(camera, renderer.domElement);
        control.setSize(1.0); // Size of arrows
        control.addEventListener('dragging-changed', function (event) {
            // CRITICAL: Disable camera movement when moving an object
            orbit.enabled = !event.value;
        });
        scene.add(control);

        // --- CAMERA MODES LOGIC ---
        const btnCamLook = document.getElementById('cam-look');
        const btnCamFloat = document.getElementById('cam-float');
        const instrDiv = document.getElementById('instructions');

        function setCameraMode(mode) {
            if (mode === 'look') {
                // Mode 1: Look Around (Rotate)
                // Left Click / 1 Finger = Rotate
                // Right Click / 2 Fingers = Pan
                orbit.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                orbit.mouseButtons.RIGHT = THREE.MOUSE.PAN;
                orbit.touches.ONE = THREE.TOUCH.ROTATE;
                orbit.touches.TWO = THREE.TOUCH.PAN;
                
                // UI Styles
                btnCamLook.classList.add('active-cam');
                btnCamFloat.classList.remove('active-cam');
                instrDiv.innerHTML = "<b>Mode: LOOK</b> - Drag to Rotate View";
            } else {
                // Mode 2: Float (Change Position)
                // Left Click / 1 Finger = Pan (Move)
                // Right Click / 2 Fingers = Rotate
                orbit.mouseButtons.LEFT = THREE.MOUSE.PAN;
                orbit.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
                orbit.touches.ONE = THREE.TOUCH.PAN;
                orbit.touches.TWO = THREE.TOUCH.ROTATE;

                // UI Styles
                btnCamFloat.classList.add('active-cam');
                btnCamLook.classList.remove('active-cam');
                instrDiv.innerHTML = "<b>Mode: FLOAT</b> - Drag to Move Camera Position";
            }
        }

        // Bind Camera Buttons
        btnCamLook.addEventListener('click', (e) => { e.stopPropagation(); setCameraMode('look'); });
        btnCamFloat.addEventListener('click', (e) => { e.stopPropagation(); setCameraMode('float'); });

        // --- OBJECT LOGIC ---
        const objects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function addObject(type) {
            let geometry;
            switch(type) {
                case 'cube': geometry = new THREE.BoxGeometry(2, 2, 2); break;
                case 'sphere': geometry = new THREE.SphereGeometry(1.5, 32, 32); break;
                case 'cone': geometry = new THREE.ConeGeometry(1.5, 3, 32); break;
                case 'torus': geometry = new THREE.TorusGeometry(1.2, 0.4, 16, 50); break;
            }
            const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.3 });
            const mesh = new THREE.Mesh(geometry, material);
            // Spawn in front of camera, but on floor
            mesh.position.set(
                camera.position.x + (Math.random()-0.5)*5, 
                2, 
                camera.position.z + (Math.random()-0.5)*5 - 5
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            objects.push(mesh);
            attachControl(mesh);
        }

        function attachControl(mesh) {
            control.attach(mesh);
            document.getElementById('info').style.opacity = '1';
        }
        function detachControl() {
            control.detach();
            document.getElementById('info').style.opacity = '0';
        }

        // --- EVENT LISTENERS ---
        document.getElementById('add-cube').onclick = (e) => { e.stopPropagation(); addObject('cube'); };
        document.getElementById('add-sphere').onclick = (e) => { e.stopPropagation(); addObject('sphere'); };
        document.getElementById('add-cone').onclick = (e) => { e.stopPropagation(); addObject('cone'); };
        document.getElementById('add-torus').onclick = (e) => { e.stopPropagation(); addObject('torus'); };

        const btnTranslate = document.getElementById('mode-translate');
        const btnRotate = document.getElementById('mode-rotate');

        function setObjMode(mode) {
            control.setMode(mode);
            if(mode === 'translate') {
                btnTranslate.classList.add('active-mode');
                btnRotate.classList.remove('active-mode');
            } else {
                btnRotate.classList.add('active-mode');
                btnTranslate.classList.remove('active-mode');
            }
        }

        btnTranslate.onclick = (e) => { e.stopPropagation(); setObjMode('translate'); };
        btnRotate.onclick = (e) => { e.stopPropagation(); setObjMode('rotate'); };

        document.getElementById('action-delete').onclick = (e) => {
            e.stopPropagation();
            if (control.object) {
                const selected = control.object;
                control.detach();
                scene.remove(selected);
                objects.splice(objects.indexOf(selected), 1);
                selected.geometry.dispose(); selected.material.dispose();
                document.getElementById('info').style.opacity = '0';
            }
        };

        // Selection Logic
        window.addEventListener('pointerdown', (event) => {
            if(control.dragging) return; // Don't select if dragging gizmo
            
            // UI click prevention check
            if(event.target.closest('button') || event.target.closest('#ui-panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(objects);
            if (intersects.length > 0) {
                attachControl(intersects[0].object);
            } else {
                // If checking floor, and not interacting with gizmo, deselect
                const intersectPlane = raycaster.intersectObject(plane);
                if(intersectPlane.length > 0) detachControl();
            }
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        
        animate();
        addObject('cube'); // Init
        setCameraMode('look'); // Default mode

    </script>
</body>
</html>
